<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ohmforge · browser</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --panel: #171a21;
        --ink: #e6e6e6;
        --muted: #8b93a7;
        --accent: #7ee787;
        --border: #2a2f3a;
        --err: #ff7b72;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      header h1 { margin: 0; font-size: 18px; }
      header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 16px 20px;
        max-width: 1200px;
      }
      @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
      }
      label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
      textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        background: #0b0d12;
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 10px; }
      .row > div { flex: 0 0 auto; }
      input[type="number"] {
        width: 120px;
        background: #0b0d12;
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        font: inherit;
      }
      input[type="text"] {
        width: 92px;
        background: #0b0d12;
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .editor { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
      table.parts td button {
        padding: 2px 8px;
        font-size: 12px;
      }
      table.parts td { font-size: 12px; }
      select, button {
        background: #0b0d12;
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 12px;
        font: inherit;
        cursor: pointer;
      }
      button.run { background: var(--accent); color: #0b0d12; font-weight: 600; border: none; }
      button:disabled { opacity: 0.5; cursor: default; }
      pre.scope {
        margin: 0;
        overflow: auto;
        background: #0b0d12;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--accent);
        white-space: pre;
      }
      table { width: 100%; border-collapse: collapse; font: 13px ui-monospace, monospace; }
      th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); font-weight: 500; }
      .err { color: var(--err); font-family: ui-monospace, monospace; white-space: pre-wrap; }
      .muted { color: var(--muted); }
      tr.probed td { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>ohmforge · in the browser</h1>
      <p>
        The Rust <code>ohmforge-sim</code> engine compiled to WebAssembly. Paste a netlist
        (or pick a demo), run an operating point + transient, and read the braille scope.
      </p>
    </header>

    <main>
      <section class="panel">
        <label for="netlist">Netlist</label>
        <textarea id="netlist" spellcheck="false"></textarea>
        <div class="row">
          <div>
            <label for="demo">Demo</label>
            <select id="demo"></select>
          </div>
          <div>
            <label for="duration">Duration (s)</label>
            <input id="duration" type="number" value="0.005" step="0.001" min="0" />
          </div>
          <div>
            <label for="step">Step (s, 0 = auto)</label>
            <input id="step" type="number" value="0.000005" step="0.000001" min="0" />
          </div>
          <div>
            <label for="probes">Probes (nodes)</label>
            <input id="probes" type="text" style="width:140px" placeholder="out in" spellcheck="false" />
          </div>
          <div>
            <label>&nbsp;</label>
            <button id="run" class="run" disabled>Run</button>
          </div>
          <div>
            <label>&nbsp;</label>
            <button id="share" disabled>Copy session link</button>
          </div>
          <div>
            <label>&nbsp;</label>
            <button id="coedit" disabled>Co-edit: sync tabs</button>
          </div>
        </div>

        <div class="editor">
          <label>Parts — add, list, remove (kept in sync with the netlist)</label>
          <table class="parts" id="parts"><tbody></tbody></table>
          <div class="row">
            <div>
              <label for="p-ref">Ref</label>
              <input id="p-ref" type="text" placeholder="R2" spellcheck="false" />
            </div>
            <div>
              <label for="p-a">Node A</label>
              <input id="p-a" type="text" placeholder="out" spellcheck="false" />
            </div>
            <div>
              <label for="p-b">Node B</label>
              <input id="p-b" type="text" placeholder="gnd" spellcheck="false" />
            </div>
            <div>
              <label for="p-val">Value</label>
              <input id="p-val" type="text" placeholder="2k" spellcheck="false" />
            </div>
            <div>
              <label>&nbsp;</label>
              <button id="p-add" disabled>Add part</button>
            </div>
          </div>
          <p id="edit-err" class="err" style="margin:6px 0 0"></p>
        </div>

        <p id="status" class="muted" style="margin:10px 0 0">Loading WebAssembly…</p>
      </section>

      <section class="panel">
        <label>Scope — transient node voltages (braille)</label>
        <pre class="scope" id="scope">(run a simulation to see the scope)</pre>
        <label style="margin-top:14px">Operating point</label>
        <table id="op"><tbody></tbody></table>
        <p id="error" class="err"></p>
      </section>
    </main>

    <script type="module">
      import init, {
        simulate,
        decode_share,
        list_parts,
        edit_add,
        edit_remove,
        encode_session_share,
        decode_session_share,
        CoEdit,
      } from "./pkg/ohmforge_web.js";

      const DEMOS = {
        "RC low-pass": `# out charges toward the 5 V rail through R1
.title rc-lowpass
V1 in  gnd 5
R1 in  out 1k
C1 out gnd 1u
`,
        "RLC resonator": `# a series RLC — the output rings on the step
.title rlc
V1 in  gnd 5
R1 in  a   50
L1 a   out 10m
C1 out gnd 100n
`,
        "RC divider chain": `# two cascaded RC sections
.title rc2
V1 in  gnd 5
R1 in  a   1k
C1 a   gnd 100n
R2 a   out 1k
C2 out gnd 100n
`,
      };

      const $ = (id) => document.getElementById(id);
      const demoSel = $("demo");
      const netlist = $("netlist");
      const statusEl = $("status");
      const errEl = $("error");
      const editErr = $("edit-err");

      for (const name of Object.keys(DEMOS)) {
        const o = document.createElement("option");
        o.value = name;
        o.textContent = name;
        demoSel.appendChild(o);
      }
      demoSel.addEventListener("change", () => {
        netlist.value = DEMOS[demoSel.value];
        refreshParts();
      });
      netlist.value = DEMOS[Object.keys(DEMOS)[0]];

      // The probed node names, split on whitespace/commas (empty tokens dropped).
      const probeList = () =>
        $("probes")
          .value.split(/[\s,]+/)
          .map((s) => s.trim())
          .filter(Boolean);

      // A shareable link restores a *full session* (CP-WEB.4): the netlist plus
      // the view settings the page holds — duration, step and probes — packed
      // (base64url) into the URL fragment. `encode_session_share` /
      // `decode_session_share` are the wasm wrappers over the host-tested Rust
      // encode_session/decode_session. On load we try the session token first and
      // fall back to a plain M4 netlist-only token, so older links still open.
      function loadFromHash() {
        const frag = location.hash.slice(1); // drop the leading '#'
        if (!frag) return false;
        try {
          const s = JSON.parse(decode_session_share(frag)); // throws on a bad token
          netlist.value = s.netlist;
          $("duration").value = s.duration;
          $("step").value = s.step == null ? 0 : s.step;
          $("probes").value = (s.probes || []).join(" ");
          return true;
        } catch {
          const decoded = decode_share(frag); // "" on an unrecognized fragment
          if (!decoded) return false;
          netlist.value = decoded;
          return true;
        }
      }

      async function shareLink() {
        const duration = parseFloat($("duration").value) || 0;
        const step = parseFloat($("step").value) || 0;
        const token = encode_session_share(
          netlist.value,
          duration,
          step,
          probeList().join("\n")
        );
        // Update the address bar without adding a history entry.
        history.replaceState(null, "", "#" + token);
        const url = location.href;
        try {
          await navigator.clipboard.writeText(url);
          statusEl.textContent = "Session link copied to clipboard.";
        } catch {
          // Clipboard may be unavailable (insecure context / denied); the hash
          // is still set, so the user can copy the URL from the address bar.
          statusEl.textContent = "Session link set in the address bar — copy it to share.";
        }
      }

      function runSim() {
        errEl.textContent = "";
        const duration = parseFloat($("duration").value) || 0;
        const step = parseFloat($("step").value) || 0;
        let json;
        try {
          json = simulate(netlist.value, duration, step);
        } catch (e) {
          $("scope").textContent = "(simulation failed)";
          $("op").querySelector("tbody").innerHTML = "";
          errEl.textContent = String(e);
          return;
        }
        const r = JSON.parse(json);
        $("scope").textContent = r.scope || "(no scope)";
        const tbody = $("op").querySelector("tbody");
        const probes = probeList();
        tbody.innerHTML =
          "<tr><th>node</th><th>voltage</th></tr>" +
          r.op
            .map((n) => {
              const probed = probes.some((p) => n.name.includes(p));
              return `<tr class="${probed ? "probed" : ""}"><td>${n.name}</td><td>${n.v == null ? "—" : n.v.toPrecision(5) + " V"}</td></tr>`;
            })
            .join("");
        statusEl.textContent = `OK — ${r.nodes.length} node(s), ${r.x.length} transient sample(s).`;
        refreshParts();
      }

      // --- Structured editing (CP-WEB.3) ---------------------------------
      // The parts form is a view over the netlist text: `list_parts` reads the
      // textarea into a structured list, and `edit_add` / `edit_remove` rewrite
      // the textarea. Both sides are the host-tested Rust model, so the form and
      // the text can never drift apart.
      function refreshParts() {
        editErr.textContent = "";
        const tbody = $("parts").querySelector("tbody");
        let model;
        try {
          model = JSON.parse(list_parts(netlist.value));
        } catch (e) {
          // Netlist isn't currently parseable (mid-edit); show it, leave the
          // last good list in place rather than clearing it.
          editErr.textContent = String(e);
          return;
        }
        if (model.parts.length === 0) {
          tbody.innerHTML =
            "<tr><td class='muted' colspan='5'>(no parts yet — add one below)</td></tr>";
          return;
        }
        tbody.innerHTML =
          "<tr><th>ref</th><th>kind</th><th>nodes</th><th>value</th><th></th></tr>" +
          model.parts
            .map(
              (p) =>
                `<tr><td>${p.reference}</td><td>${p.kind}</td>` +
                `<td>${p.node_a} → ${p.node_b}</td><td>${p.value}</td>` +
                `<td><button data-ref="${p.reference}" class="rm">remove</button></td></tr>`
            )
            .join("");
        for (const btn of tbody.querySelectorAll("button.rm")) {
          btn.addEventListener("click", () => removePart(btn.dataset.ref));
        }
      }

      function addPart() {
        editErr.textContent = "";
        try {
          // With co-edit on, route the edit through the replica so it is
          // broadcast as an op; otherwise rewrite the text directly (CP-WEB.3).
          netlist.value = co
            ? co.add_part($("p-ref").value, $("p-a").value, $("p-b").value, $("p-val").value)
            : edit_add(netlist.value, $("p-ref").value, $("p-a").value, $("p-b").value, $("p-val").value);
        } catch (e) {
          editErr.textContent = String(e);
          return;
        }
        $("p-ref").value = $("p-a").value = $("p-b").value = $("p-val").value = "";
        runSim(); // re-simulate on edit
      }

      function removePart(ref) {
        editErr.textContent = "";
        try {
          netlist.value = co ? co.remove_part(ref) : edit_remove(netlist.value, ref);
        } catch (e) {
          editErr.textContent = String(e);
          return;
        }
        runSim(); // re-simulate on edit
      }

      // --- Real-time co-edit (CP-WEB.5) ----------------------------------
      // A thin layer over the host-tested op-merge: `CoEdit` wraps a replica and
      // a same-origin `BroadcastChannel`; local part edits broadcast an op, and a
      // sibling channel feeds incoming ops back through `co.receive`. Two tabs on
      // the same room converge to one netlist. (CP-WEB.6 adds the hosted relay for
      // cross-machine sessions: a WebSocket to `ohmforge-web --features relay` drops in
      // right here in place of the BroadcastChannel, carrying the same op tokens.)
      let co = null; // active replica, or null when co-edit is off
      let rx = null; // inbound channel
      function toggleCoedit() {
        if (co) {
          rx.close();
          co.close();
          co = rx = null;
          $("coedit").textContent = "Co-edit: sync tabs";
          statusEl.textContent = "Co-edit off.";
          return;
        }
        const room = "ohmforge-coedit"; // same-origin room shared by every tab
        const site = BigInt(Math.floor(Math.random() * 2 ** 31)); // distinct per tab
        co = new CoEdit(site, room);
        // Seed the replica from the current parts so this tab contributes its
        // state (each add is broadcast as an op the other tabs merge).
        try {
          const model = JSON.parse(list_parts(netlist.value));
          if (model.title) co.set_title(model.title);
          for (const p of model.parts) co.add_part(p.reference, p.node_a, p.node_b, p.value);
          netlist.value = co.netlist();
        } catch (e) {
          editErr.textContent = String(e);
        }
        rx = new BroadcastChannel(room);
        rx.onmessage = (e) => {
          try {
            netlist.value = co.receive(e.data); // garbage ops throw → ignored
            refreshParts();
            runSim();
          } catch {}
        };
        $("coedit").textContent = "Co-edit: ON (stop)";
        statusEl.textContent = "Co-edit on — part edits sync to other tabs on this origin.";
        refreshParts();
        runSim();
      }

      init()
        .then(() => {
          statusEl.textContent = "Ready.";
          $("run").disabled = false;
          $("share").disabled = false;
          $("p-add").disabled = false;
          $("coedit").disabled = false;
          $("run").addEventListener("click", runSim);
          $("share").addEventListener("click", shareLink);
          $("p-add").addEventListener("click", addPart);
          $("coedit").addEventListener("click", toggleCoedit);
          // Typing in the netlist keeps the parts list in sync (no re-run).
          netlist.addEventListener("input", refreshParts);
          // A shared link (#…) wins over the default demo: load it, then run.
          loadFromHash();
          runSim();
          // Follow in-page hash changes (e.g. back/forward, pasted #link).
          window.addEventListener("hashchange", () => {
            if (loadFromHash()) runSim();
          });
        })
        .catch((e) => {
          statusEl.textContent = "Failed to load WebAssembly: " + e;
        });
    </script>
  </body>
</html>

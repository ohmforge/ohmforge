[package]
name = "ohmforge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Core data model for ohmforge: circuit graph, units, values, time. No I/O, no UI; deterministic and WASM-clean."

[lints]
workspace = true

[dependencies]

[dev-dependencies]
# Benches only; dev-deps never ship in the library crate, so this keeps ohmforge-core
# itself dependency-free and wasm/MSRV-clean. Default features off; we only need
# `cargo_bench_support` to run a `harness = false` bench under `cargo bench`.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false

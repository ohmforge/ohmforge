[package]
name = "ee-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AI copilot: Claude client, tool definitions over the circuit API, RAG over parts, verification loop, offline heuristics."

[lints]
workspace = true

[features]
# The real network transport, OPT-IN. With the feature OFF (the default) the
# crate is dependency-free and `wasm32`-clean — `reqwest`/`serde_json` appear in
# the tree only under `--features http`. Enabling it wires `HttpTransport::send`
# to a live Claude Messages round-trip: a native `reqwest` blocking client
# (rustls, so no system-TLS/OpenSSL requirement), with the `wasm32` `fetch` path
# left as a documented TODO stub. `serde_json` builds the request body and
# parses the response; the crate's own types stay serde-free (they carry no
# derives — tool input/schema remain opaque JSON text).
http = ["dep:reqwest", "dep:serde_json"]

[dependencies]
ee-core = { workspace = true }
# The tool layer (CP-AF-M1.3) drives the SAME shell + engine a user drives, so
# the model can only do what a user could (docs/AI.md § trust model). No new
# third-party crates: the shell already re-exports the sim engine it needs.
ee-shell = { workspace = true }
# The verification loop (CP-AF-M2.1) MEASURES spec quantities (e.g. a load
# current) from a real operating-point solve of the scratch circuit. `ee-shell`
# does not re-export the engine, so the loop reaches it directly. A workspace
# crate, not a third-party dep — in keeping with the std-only, no-network rule.
ee-sim = { workspace = true }
# No third-party deps in the DEFAULT build: the Claude client is hand-rolled
# std-only (matching ee-fmt's hand-written parsers) so the copilot loop is
# network-free and the crate compiles for wasm32 without a TLS stack. Tool
# input/result and JSON schema are carried as opaque JSON *text*, so no serde is
# needed for the loop; serialization lands with the live HTTP transport, gated
# behind `http` below.

# Live HTTP transport — NATIVE only and OPT-IN (behind `http`). Keeping these in
# a `cfg(not(wasm32))` table means the `wasm32` core build never even considers
# them; the default (feature-off) build pulls neither. `reqwest` is the blocking
# client (rustls-tls → no OpenSSL/system-TLS dependency); `serde_json` builds the
# Anthropic request body and parses the response (ee-ai's own types stay
# serde-free). The `wasm32 + http` combination uses a documented TODO stub and
# needs no dependency.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde_json = { version = "1", optional = true }

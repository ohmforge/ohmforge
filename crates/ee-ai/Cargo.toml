[package]
name = "ee-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AI copilot: Claude client, tool definitions over the circuit API, RAG over parts, verification loop, offline heuristics."

[lints]
workspace = true

[features]
# The real network transport. A std-only, no-network STUB today (CP-AF-M1.2 is
# the loop, not live calls): it compiles and reads the API key from the env but
# returns an error if asked to send. The HTTP/TLS stack (native reqwest, wasm
# fetch) lands with the UI, behind this same flag — so enabling it drags in no
# async runtime yet and the default build stays dependency-free and wasm-safe.
http = []

[dependencies]
ee-core = { workspace = true }
# The tool layer (CP-AF-M1.3) drives the SAME shell + engine a user drives, so
# the model can only do what a user could (docs/AI.md § trust model). No new
# third-party crates: the shell already re-exports the sim engine it needs.
ee-shell = { workspace = true }
# No third-party deps: the Claude client is hand-rolled std-only (matching
# ee-fmt's hand-written parsers) so the copilot loop is network-free and the
# crate compiles for wasm32 without a TLS stack. Tool input/result and JSON
# schema are carried as opaque JSON *text*, so no serde is needed for the loop;
# serialization lands with the live HTTP transport under the `http` feature.

[package]
name = "ee-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Analog / mixed-signal engine: MNA, Newton-Raphson, transient/DC/AC/noise analyses."

[lints]
workspace = true

[dependencies]
ee-core = { workspace = true }

[dev-dependencies]
# Benches only; dev-deps never ship in the library crate, so this keeps ee-sim
# itself dependency-free and wasm/MSRV-clean. Default features off; we only need
# `cargo_bench_support` to run a `harness = false` bench under `cargo bench`.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "solve"
harness = false

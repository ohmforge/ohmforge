[package]
name = "ee-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WASM browser front end: wasm-bindgen glue that parses a netlist, runs ee-sim, and returns JSON + a braille scope string (CP-WEB.1)."

[lints]
workspace = true

# A cdylib is what wasm-bindgen / wasm-pack link into a `.wasm`; `rlib` keeps the
# pure pipeline logic (and its host-side #[test]s) available to `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

# The whole-crate dependency graph on the HOST target is just the three
# wasm-clean compute crates — no wasm-bindgen/js-sys/web-sys — so the crate stays
# a normal workspace member and `cargo build/clippy/test --workspace` build it on
# aarch64-apple-darwin exactly like any other crate. ee-core/ee-sim stay
# dependency-free; the wasm glue lives only in this crate.
[dependencies]
ee-core = { workspace = true }
ee-sim = { workspace = true }
ee-fmt = { workspace = true }

# The browser-only glue. Gated behind the wasm32 target so it is absent on the
# host build (wasm-bindgen does not compile for aarch64-apple-darwin), which is
# what keeps the host workspace gates green.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

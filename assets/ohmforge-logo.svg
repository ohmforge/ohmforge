<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="ohmforge">
  <title>ohmforge</title>
  <desc>The ohmforge wordmark: an omega (ohm) forged on an anvil with a struck spark, beside the name "ohmforge".</desc>
  <!-- Mark (same as ohmforge-mark.svg), nudged to sit on the text baseline. -->
  <g transform="translate(2,0)">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 41 L25 41 L25 37
               C19 35 15 29 15 23
               C15 14 22 8 32 8
               C42 8 49 14 49 23
               C49 29 45 35 39 37
               L39 41 L47 41" />
    </g>
    <g fill="currentColor">
      <path d="M8 47 L14 45 L52 45 L52 49 L14 49 Z" />
      <path d="M29 49 L35 49 L34 52 L30 52 Z" />
      <path d="M22 52 L42 52 L42 56 L22 56 Z" />
    </g>
    <path d="M32 0 L34 5 L39 7 L34 9 L32 14 L30 9 L25 7 L30 5 Z" fill="#f5a623" />
  </g>
  <!-- Wordmark. "ohm" regular, "forge" heavier, to echo ohm + forge. -->
  <text x="74" y="42"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="34" letter-spacing="0.5" fill="currentColor">
    <tspan font-weight="400">ohm</tspan><tspan font-weight="700">forge</tspan>
  </text>
</svg>

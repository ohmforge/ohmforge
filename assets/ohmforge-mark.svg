<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ohmforge mark">
  <title>ohmforge</title>
  <desc>An omega (ohm) forged on an anvil, with a spark struck at its crown.</desc>
  <!-- Colors: the omega + anvil follow the surrounding text color (works in light
       and dark); the spark is a fixed forge-amber that reads on either theme. -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Omega (ohm): an open loop standing on two feet. -->
    <path d="M17 41 L25 41 L25 37
             C19 35 15 29 15 23
             C15 14 22 8 32 8
             C42 8 49 14 49 23
             C49 29 45 35 39 37
             L39 41 L47 41" />
  </g>
  <!-- Anvil: horned top face, neck, and flared base. -->
  <g fill="currentColor">
    <path d="M8 47 L14 45 L52 45 L52 49 L14 49 Z" />
    <path d="M29 49 L35 49 L34 52 L30 52 Z" />
    <path d="M22 52 L42 52 L42 56 L22 56 Z" />
  </g>
  <!-- Forge spark struck at the omega's crown. -->
  <path d="M32 0 L34 5 L39 7 L34 9 L32 14 L30 9 L25 7 L30 5 Z" fill="#f5a623" />
</svg>

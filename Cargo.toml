# ohmforge — Cargo workspace
# See docs/ARCHITECTURE.md for what each crate does.
[workspace]
resolver = "2"
members = [
    "crates/ohmforge-core",
    "crates/ohmforge-sim",
    "crates/ohmforge-digital",
    "crates/ohmforge-mcu",
    "crates/ohmforge-devices",
    "crates/ohmforge-instruments",
    "crates/ohmforge-fmt",
    "crates/ohmforge-tui",
    "crates/ohmforge-shell",
    "crates/ohmforge-ai",
    "crates/ohmforge",
    "crates/ohmforge-web",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.79"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ohmforge/ohmforge"
homepage = "https://github.com/ohmforge/ohmforge"
authors = ["The ohmforge Authors"]
# Shared crates.io discovery metadata; crates inherit with `keywords.workspace = true`.
keywords = ["electronics", "simulation", "spice", "circuit", "eda"]
categories = ["simulation", "science", "command-line-utilities"]

# Shared dependency versions live here; crates opt in with `dep = { workspace = true }`.
# Kept commented until first use so the scaffold builds with zero network deps.
[workspace.dependencies]
ohmforge-core        = { path = "crates/ohmforge-core" }
ohmforge-sim         = { path = "crates/ohmforge-sim" }
ohmforge-digital     = { path = "crates/ohmforge-digital" }
ohmforge-mcu         = { path = "crates/ohmforge-mcu" }
ohmforge-devices     = { path = "crates/ohmforge-devices" }
ohmforge-instruments = { path = "crates/ohmforge-instruments" }
ohmforge-fmt         = { path = "crates/ohmforge-fmt" }
ohmforge-tui         = { path = "crates/ohmforge-tui" }
ohmforge-shell       = { path = "crates/ohmforge-shell" }
ohmforge-ai          = { path = "crates/ohmforge-ai" }
# Third-party (uncomment as milestones need them):
# ratatui   = "0.28"
# crossterm = "0.28"
# faer      = "0.19"      # linear algebra / sparse solve
# thiserror = "1"
# anyhow    = "1"
# serde     = { version = "1", features = ["derive"] }
# rhai      = "1"         # embedded scripting for eesh

# Lint policy shared by every crate (each opts in with `[lints] workspace = true`).
# CI runs clippy with `-D warnings`, so these levels are effectively enforced.
[workspace.lints.rust]
unsafe_code = "warn"       # allowed only with a documented #[allow] + justification

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwind (not abort): the TUI panic hook restores the terminal, and the AI
# verify-loop runs candidate patches on a scratch circuit and must catch a
# solver panic instead of killing the process. See docs/ARCHITECTURE.md
# §Cross-cutting design decisions.
panic = "unwind"

[profile.dev]
opt-level = 1       # keep the simulator usable in debug builds

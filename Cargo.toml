# ohmforge — Cargo workspace
# See docs/ARCHITECTURE.md for what each crate does.
[workspace]
resolver = "2"
# The `fuzz/` crate is a standalone cargo-fuzz workspace (its own [workspace],
# nightly + libFuzzer only). It is intentionally EXCLUDED so the default
# `cargo build/test/clippy --workspace` never pulls in libfuzzer-sys and nothing
# shipped depends on it. (CP-PLAT-M10.2.)
exclude = ["fuzz"]
members = [
    "crates/ohmforge-core",
    "crates/ohmforge-sim",
    "crates/ohmforge-digital",
    "crates/ohmforge-mcu",
    "crates/ohmforge-devices",
    "crates/ohmforge-instruments",
    "crates/ohmforge-fmt",
    "crates/ohmforge-tui",
    "crates/ohmforge-shell",
    "crates/ohmforge-ai",
    "crates/ohmforge",
    "crates/ohmforge-web",
]

[workspace.package]
version = "0.8.1"
edition = "2021"
rust-version = "1.79"
license = "Apache-2.0"
repository = "https://github.com/ohmforge/ohmforge"
# (homepage omitted — cargo flags it as redundant with `repository`; authors live in
#  LICENSE/NOTICE rather than a workspace field no crate inherits.)
# Shared crates.io discovery metadata; crates inherit with `keywords.workspace = true`.
keywords = ["electronics", "simulation", "spice", "circuit", "eda"]
categories = ["simulation", "science", "command-line-utilities"]

# Shared dependency versions live here; crates opt in with `dep = { workspace = true }`.
# Kept commented until first use so the scaffold builds with zero network deps.
# Path + version so `cargo publish` resolves a crates.io dependency while local
# builds use the in-tree path. Versions track the workspace version.
[workspace.dependencies]
ohmforge-core        = { path = "crates/ohmforge-core", version = "0.8.1" }
ohmforge-sim         = { path = "crates/ohmforge-sim", version = "0.8.1" }
ohmforge-digital     = { path = "crates/ohmforge-digital", version = "0.8.1" }
ohmforge-mcu         = { path = "crates/ohmforge-mcu", version = "0.8.1" }
ohmforge-devices     = { path = "crates/ohmforge-devices", version = "0.8.1" }
ohmforge-instruments = { path = "crates/ohmforge-instruments", version = "0.8.1" }
ohmforge-fmt         = { path = "crates/ohmforge-fmt", version = "0.8.1" }
ohmforge-tui         = { path = "crates/ohmforge-tui", version = "0.8.1" }
ohmforge-shell       = { path = "crates/ohmforge-shell", version = "0.8.1" }
ohmforge-ai          = { path = "crates/ohmforge-ai", version = "0.8.1" }
# Dev-only (never a normal/shipped dependency): property-testing harness shared
# across the parser crates' and the solver's `[dev-dependencies]`. (CP-PLAT-M10.2.)
proptest = "1"
# Third-party (uncomment as milestones need them):
# ratatui   = "0.28"
# crossterm = "0.28"
# faer      = "0.19"      # linear algebra / sparse solve
# thiserror = "1"
# anyhow    = "1"
# serde     = { version = "1", features = ["derive"] }
# rhai      = "1"         # embedded scripting for eesh

# Lint policy shared by every crate (each opts in with `[lints] workspace = true`).
# CI runs clippy with `-D warnings`, so these levels are effectively enforced.
[workspace.lints.rust]
unsafe_code = "warn"       # allowed only with a documented #[allow] + justification

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwind (not abort): the TUI panic hook restores the terminal, and the AI
# verify-loop runs candidate patches on a scratch circuit and must catch a
# solver panic instead of killing the process. See docs/ARCHITECTURE.md
# §Cross-cutting design decisions.
panic = "unwind"

[profile.dev]
opt-level = 1       # keep the simulator usable in debug builds

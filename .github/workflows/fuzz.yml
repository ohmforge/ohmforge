name: fuzz

# CP-PLAT-M10.2 — build the cargo-fuzz targets and run a bounded smoke of each.
# Separate workflow (off the PR matrix): a short smoke on pushes to `main` and on
# manual dispatch, and a longer run on a nightly schedule. The `fuzz/` crate is a
# standalone, nightly-only cargo-fuzz workspace, so this never touches the normal
# build/test matrix.
on:
  push:
    branches: [main]
    paths:
      - "crates/ohmforge-core/**"
      - "crates/ohmforge-fmt/**"
      - "crates/ohmforge-digital/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # 03:17 UTC daily — a longer, deeper run.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: build + smoke fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # libFuzzer's sanitizers need a dynamic libc; pin the gnu target so
          # cargo-fuzz doesn't default to the static musl target (crt-static,
          # which the sanitizer rejects: "incompatible with statically linked libc").
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz"
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build all fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
      # A few seconds per target on a push/dispatch; five minutes each nightly.
      - name: Smoke each target
        working-directory: fuzz
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MAX_TIME=300
          else
            MAX_TIME=10
          fi
          for target in value_parse netlist_parse spice_import digital_expr; do
            echo "=== fuzzing $target for ${MAX_TIME}s ==="
            cargo +nightly fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time="$MAX_TIME"
          done

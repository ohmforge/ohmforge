name: Pages (live demo)

# Builds the WASM bundle and publishes crates/ohmforge-web/www as the live
# browser demo at https://ohmforge.github.io/ohmforge/ . Run on pushes to main
# and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the WASM bundle
        run: wasm-pack build crates/ohmforge-web --target web --out-dir www/pkg
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/ohmforge-web/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
